name: style-snips

run-name: style snippets

# Owner 25 Nov 2026: cut small narration snippets (mono mp3) from episode masters (R2 or Drive) into R2 for a style check.
# The job list lives in the private R2 bucket; this public log prints only counts.

on:
  workflow_dispatch:
    inputs:
      job: { description: 'R2 key of the job JSON (s2work/.../job.json)', required: true }

env:
  CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
  CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
  CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
  DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
  JOB: ${{ inputs.job }}

jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q boto3 numpy
      - run: |
          mkdir -p ff && cd ff
          curl -sSL --fail -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-05-31-14-01/ffmpeg-N-119779-g6c291232cf-linux64-gpl.tar.xz
          tar -xf ff.tar.xz && cp */bin/ffmpeg */bin/ffprobe . && rm -rf ff.tar.xz */
      - run: python style_snips.py "$JOB" ${{ matrix.shard }} 8
