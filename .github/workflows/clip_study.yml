name: clip-study
run-name: clip study ${{ inputs.mode }}
# TEMP (owner 28 Nov 2026): Shorts clip-use study. Frames/JSON go to R2 s2work/tmp_clipstudy1128/ only. Deleted after the study.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'list or study', required: true, default: 'list' }
      parts: { description: 'matrix as JSON list of part indexes', required: false, default: '[0]' }
env:
  CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
  CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
  CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: { part: '${{ fromJSON(inputs.parts) }}' }
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -U boto3 "yt-dlp[default]" pillow numpy
          if [ "${{ inputs.mode }}" != "list" ]; then
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q faster-whisper resemblyzer soundfile
          fi
      - run: |
          python -c "import boto3,os;boto3.client('s3',endpoint_url=os.environ['CF_R2_ENDPOINT'],aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],region_name='auto').download_file('eduorbex-media','s2work/tmp_clipstudy1128/code/clipstudy.py','cs.py')"
          python -u cs.py "${{ inputs.mode }}" "${{ matrix.part }}" "${{ strategy.job-total }}"
