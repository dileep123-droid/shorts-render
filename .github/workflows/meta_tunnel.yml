name: meta-tunnel

run-name: meta ${{ inputs.job }}

# Owner 23 Nov 2026: Meta AI clips made on GitHub; Meta sees the owner's laptop internet (Cloudflare quick tunnel -> laptop_bridge.py).
# Job, tunnel address and Meta session are read from the private R2 bucket at run time; this public log prints only counts/states.
concurrency: { group: meta-tunnel, cancel-in-progress: false }

on:
  workflow_dispatch:
    inputs:
      job: { description: 'R2 key of the job json (s2work/meta_tunnel/jobs/<name>.json)', required: true }

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q playwright==1.48.0 websockets==13.1 boto3 && python -m playwright install --with-deps chromium > /dev/null
      - run: python meta_gh.py "${{ inputs.job }}"
